version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ar-guide-app
    restart: unless-stopped
    ports:
      - "4626:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production_min32chars}
      - DB_PATH=/app/data/ar-guide.db
      - ADMIN_INVITE_CODE=${ADMIN_INVITE_CODE:-ARGUIDE-ADMIN-2026}
      - CERT_LOGO_PATH=/app/uploads/logo.png
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    networks:
      - ar-guide-network

networks:
  ar-guide-network:
    driver: bridge
