<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Viewer Test</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        .info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-family: sans-serif;
            z-index: 1000;
        }
        .model-select {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 10px;
            z-index: 1000;
        }
        select, button {
            padding: 8px 16px;
            margin: 5px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }
        select { background: #333; color: white; }
        button { background: #00ff00; color: black; font-weight: bold; }
    </style>
</head>
<body>
    <div class="info">
        <h3>AR Индустриальный гид</h3>
        <p>Наведите камеру на QR-код</p>
    </div>
    
    <div class="model-select">
        <select id="modelSelect">
            <option value="robot">Робот</option>
            <option value="soldier">Солдат</option>
            <option value="horse">Лошадь</option>
            <option value="cube">Куб</option>
        </select>
        <button onclick="changeModel()">Сменить модель</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-marker preset="hiro">
            <a-entity id="model-container" rotation="-90 0 0" scale="0.5 0.5 0.5">
                <!-- Default: Robot -->
                <a-gltf-model id="currentModel" src="/models/robot.glb" animation-mixer="clip: Idle" ></a-gltf-model>
            </a-entity>
        </a-marker>
        
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        function changeModel() {
            const select = document.getElementById('modelSelect');
            const model = select.value;
            const container = document.getElementById('model-container');
            const currentModel = document.getElementById('currentModel');
            
            if (currentModel) {
                currentModel.remove();
            }
            
            let newModel;
            
            if (model === 'cube') {
                newModel = document.createElement('a-box');
                newModel.setAttribute('color', '#4CC3D9');
                newModel.setAttribute('animation', 'property: rotation; to: 0 360 0; dur: 2000; loop: true; easing: linear');
            } else {
                newModel = document.createElement('a-gltf-model');
                newModel.setAttribute('src', `/models/${model}.glb`);
                newModel.setAttribute('animation-mixer', 'clip: Idle');
            }
            
            newModel.id = 'currentModel';
            container.appendChild(newModel);
        }
    </script>
</body>
</html>
